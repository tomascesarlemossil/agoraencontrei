[phases.setup]
nixPkgs = ["nodejs_22"]
cmds = ["npm install -g pnpm@10"]

[phases.install]
cmds = [
  "pnpm install --frozen-lockfile"
]

[phases.build]
# tomas-knowledge must build first — its `main`/`exports` point at
# ./dist/index.js, which the API imports at runtime. Without this step
# the container throws ERR_MODULE_NOT_FOUND: @agoraencontrei/tomas-knowledge
# the moment tomas.service.js is first required.
cmds = [
  "pnpm --filter @agoraencontrei/database generate",
  "pnpm --filter @agoraencontrei/tomas-knowledge build",
  "pnpm --filter @agoraencontrei/api build",
  # Guarda de boot: aborta o build se algum módulo de rota tiver import quebrado
  # (foi a causa do 502 de 01/07). Assim o Railway não sobe uma versão que não liga.
  "node apps/api/scripts/verify-route-imports.mjs"
]

[start]
# Sobe a API direto. NÃO rodar `prisma migrate deploy` aqui: o banco de produção
# nunca teve histórico de migrations (schema mantido por `db push` +
# runMigrations() idempotente em runtime), então `migrate deploy` fica preso no
# advisory lock / erro de drift ANTES do node iniciar — a API nunca liga na porta
# e o Railway responde 502. O schema é garantido pelo runMigrations() dentro do
# bootstrap (CREATE TABLE IF NOT EXISTS ...), idempotente e time-boxed.
cmd = "node apps/api/dist/server.js"
