[phases.setup]
nixPkgs = ["nodejs_22"]
cmds = ["npm install -g pnpm@10"]

[phases.install]
cmds = [
  "pnpm install --frozen-lockfile"
]

[phases.build]
# tomas-knowledge must build first — its `main`/`exports` point at
# ./dist/index.js, which the API imports at runtime. Without this step
# the container throws ERR_MODULE_NOT_FOUND: @agoraencontrei/tomas-knowledge
# the moment tomas.service.js is first required.
cmds = [
  "pnpm --filter @agoraencontrei/database generate",
  "pnpm --filter @agoraencontrei/tomas-knowledge build",
  "pnpm --filter @agoraencontrei/api build"
]

[start]
# Aplica migrations pendentes contra o banco (DATABASE_URL já vem do ambiente
# do Railway) ANTES de subir a API. Não-fatal: se o migrate falhar (ex.: drift
# do _prisma_migrations), a API ainda inicializa — coerente com o fail-open do
# projeto — e a migration pode ser aplicada manualmente.
cmd = "pnpm --filter @agoraencontrei/database migrate:deploy || echo '[deploy] prisma migrate deploy falhou — subindo a API mesmo assim'; node apps/api/dist/server.js"
