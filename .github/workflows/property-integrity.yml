name: Property integrity

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/property-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/property-integrity.yml'

jobs:
  preventive-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-no-production-credentials.js
      - run: node --test scripts/audit-public-properties.test.js
