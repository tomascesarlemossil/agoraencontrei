name: SEO Pipeline Tests

# Roda a suíte de testes do pipeline de SEO programático:
#  - packages/database: transform puro + varredura do dataset inteiro
#  - apps/api: lógica do endpoint /bairro-stats
# Nenhum teste precisa de banco (lógica pura + dataset versionado).

on:
  push:
    branches:
      - main
      - claude/seo-programmatic-analysis-1ym5tq
    paths:
      - 'packages/database/**'
      - 'apps/api/src/routes/public/**'
      - 'scripts/seo-import/**'
      - '.github/workflows/seo-tests.yml'
  pull_request:
    paths:
      - 'packages/database/**'
      - 'apps/api/src/routes/public/**'
      - 'scripts/seo-import/**'
      - '.github/workflows/seo-tests.yml'
  workflow_dispatch:

# Least-privilege: o job só lê o conteúdo do repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Os testes de integração da API importam { PrismaClient } de '@prisma/client'.
      # Sem `prisma generate`, o pacote não exporta PrismaClient e o import ESM
      # falha na carga do módulo (SyntaxError), quebrando os testes ANTES do skip.
      # (Os testes de banco pulam sem TEST_DATABASE_URL; só precisam do client gerado.)
      - name: Prisma generate
        run: pnpm db:generate

      # Os testes da API importam @agoraencontrei/tomas-knowledge pelo dist/
      # (gitignored), então o pacote precisa ser BUILDADO antes — senão os testes
      # do Tomás quebram com ERR_MODULE_NOT_FOUND.
      - name: Build workspace packages (tomas-knowledge)
        run: pnpm --filter @agoraencontrei/tomas-knowledge build

      - name: Database — transform + dataset sweep
        run: pnpm --filter @agoraencontrei/database test

      - name: API — bairro-stats + suíte existente
        run: pnpm --filter @agoraencontrei/api test
