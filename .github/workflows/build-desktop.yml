name: Build Desktop (.exe)

# Compila a edição OFFLINE (Sistema Administrador AgoraEncontrei) num runner Windows na nuvem
# e publica o instalador .exe como artifact — sem precisar de toolchain local.
#
# Disparo: manual (workflow_dispatch) ou ao mexer em apps/desktop no branch de trabalho.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/agoraencontrei-system-sales-8uth7f
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: write   # necessário para publicar o instalador num Release

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate
        continue-on-error: true

      # tomas-knowledge precisa ser buildado ANTES de api/web (ambos importam o
      # pacote; sem o dist gera ERR_MODULE_NOT_FOUND / "Module not found").
      # Mesma sequência do Dockerfile de produção.
      - name: Build packages (tomas-knowledge)
        run: pnpm --filter @agoraencontrei/tomas-knowledge build

      - name: Build API (Fastify → dist)
        run: pnpm --filter @agoraencontrei/api build
        continue-on-error: true

      - name: Build Web (Next standalone)
        run: pnpm --filter web build
        continue-on-error: true
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # O instalador offline não embute as ~13 mil páginas SEO públicas
          # (comparar de cidades = 11.476, etc.). Sem o cache de build do Vercel,
          # gerá-las a frio no runner Windows estourava o timeout. MINIMAL_SSG=1
          # faz os generateStaticParams retornarem [] (as rotas seguem via ISR).
          MINIMAL_SSG: '1'
          # Build não acessa o banco; valores fictícios evitam falha de validação de env.
          DATABASE_URL: 'postgresql://user:pass@127.0.0.1:5432/db'
          DIRECT_DATABASE_URL: 'postgresql://user:pass@127.0.0.1:5432/db'
          JWT_SECRET: 'ci-build-only-secret-key-32chars-min'
          COOKIE_SECRET: 'ci-build-only-secret-key-32chars-min'

      - name: Diagnose build outputs
        if: always()
        shell: bash
        run: |
          echo '--- apps/api/dist ---'; ls apps/api/dist 2>/dev/null | head -20 || echo '  (vazio)'
          echo '--- apps/web/.next/standalone ---'; ls apps/web/.next/standalone 2>/dev/null | head -20 || echo '  (vazio)'

      - name: Bundle embedded server (web + prisma SQL)
        run: pnpm --filter @agoraencontrei/desktop bundle
        continue-on-error: true

      # Monta a API Fastify offline: pnpm deploy (node_modules achatado) + dist +
      # Prisma Client com engine do Windows. Falha aqui DEVE quebrar o build —
      # um instalador sem a API não serve para o modo 100% offline.
      - name: Assemble offline API (pnpm deploy + prisma)
        run: pnpm --filter @agoraencontrei/desktop assemble-api

      - name: Build installer (electron-builder)
        run: pnpm --filter @agoraencontrei/desktop dist

      # Confirma que a API (node_modules + engine do Prisma) REALMENTE entrou no
      # app empacotado — o electron-builder pode descartar node_modules aninhados.
      # Falha o build (sem publicar) se faltar, evitando um instalador inútil.
      - name: Verify API packed into app
        shell: bash
        run: |
          # server/ vai como extraResources → fica em resources/server (NÃO em resources/app).
          SRV="apps/desktop/dist/win-unpacked/resources/server"
          echo "--- conteúdo de server/api ---"; ls "$SRV/api" 2>/dev/null || echo '  (server/api ausente!)'
          test -f "$SRV/api/dist/server.js"            && echo "✓ dist/server.js"        || { echo "✗ dist/server.js";  exit 1; }
          test -d "$SRV/api/node_modules/fastify"      && echo "✓ fastify"               || { echo "✗ fastify";        exit 1; }
          test -d "$SRV/api/node_modules/@prisma/client" && echo "✓ @prisma/client"      || { echo "✗ @prisma/client"; exit 1; }
          ls "$SRV/api/node_modules/.prisma/client/"*query_engine-windows*.node >/dev/null 2>&1 && echo "✓ engine windows" || { echo "✗ engine windows"; exit 1; }
          test -d "$SRV/web/apps/web/.next"            && echo "✓ web .next"             || { echo "✗ web .next";      exit 1; }
          echo "Tamanho do app empacotado (resources):"; du -sh "apps/desktop/dist/win-unpacked/resources" 2>/dev/null || true

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgoraEncontrei-Software-Setup
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 30

      # Publica o instalador num Release com tag fixa "desktop-latest", gerando
      # uma URL pública estável para o SOFTWARE_DOWNLOAD_URL:
      #   https://github.com/<owner>/<repo>/releases/download/desktop-latest/AgoraEncontrei-Software-Setup.exe
      - name: Publish installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Sistema Administrador AgoraEncontrei (instalador offline)
          body: |
            Instalador da edição offline. Baixe o `.exe`, instale e ative com sua chave de licença.
            Atualizado automaticamente a cada build do app desktop.
          files: |
            apps/desktop/dist/AgoraEncontrei-Software-Setup.exe
          make_latest: "true"
