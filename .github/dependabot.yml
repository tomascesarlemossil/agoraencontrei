version: 2
updates:
  # npm (pnpm também usa npm registry)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    reviewers:
      - "tomascesarlemossil"
    labels:
      - "dependencies"
      - "npm"
    groups:
      security:
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"
    allow:
      - dependency-type: "all"
    # Bumps de versão MAIOR quebram o build (ex.: prisma 5→7 derrubou a produção,
    # electron 31→42, nodemailer 8→9, typescript 5→6). Majors devem ser feitos
    # MANUALMENTE, com teste. O Dependabot fica só com patch/minor seguros.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
